<form action="https://formspree.io/f/xnpakaqk" method="POST" class="contact-form">
  <div class="form-group">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required placeholder="Ihr Name">
  </div>

  <div class="form-group">
    <label for="email">E-Mail:</label>
    <input type="email" id="email" name="email" required placeholder="Ihre E-Mail-Adresse">
  </div>

  <div class="form-group">
    <label for="message">Nachricht:</label>
    <textarea id="message" name="message" required placeholder="Ihre Nachricht"></textarea>
  </div>

  <button type="submit" class="submit-btn">Nachricht senden</button>

  <!-- Success message (hidden by default) -->
  <div id="form-success" style="display: none; margin-top: 1rem; color: green;">
    ✅ Danke für Ihre Nachricht! Ich werde mich bald bei Ihnen melden.
  </div>
</form>

<script>
  // Simple form handling for custom success message
  const form = document.querySelector('.contact-form');
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(form);
      fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          form.reset();
          document.getElementById('form-success').style.display = 'block';
          setTimeout(() => {
            document.getElementById('form-success').style.display = 'none';
          }, 5000);
        } else {
          alert('Es gab einen Fehler beim Senden der Nachricht. Bitte versuchen Sie es erneut.');
        }
      }).catch(error => {
        alert('Es gab einen Fehler beim Senden der Nachricht. Bitte versuchen Sie es erneut.');
      });
    });
  }
</script>

<style>
  .contact-form {
    max-width: 600px;
    margin: 0 auto;
    padding: 1rem;
  }
  .form-group {
    margin-bottom: 1rem;
  }
  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: inherit;
    font-size: 1rem;
  }
  .form-group textarea {
    min-height: 150px;
    resize: vertical;
  }
  .submit-btn {
    background-color: #2c3e50;
    color: white;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
    transition: background-color 0.3s;
  }
  .submit-btn:hover {
    background-color: #34495e;
  }
</style>
